<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css?v=4">
  <title>KOSMOS</title>
  <style>
    body { overflow: hidden; background: #20415D; }

    #app-frame {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100svh - var(--header-h));
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="./img/logo_kosmos.png" alt="KOSMOS logo">
      <span>KOSMOS</span>
    </div>
    <nav>
      <ul>
        <li><a href="#" onclick="navigate(event, 'campaign/campaign.html')">Campaign</a></li>
        <li><a href="#" onclick="navigate(event, 'config/config.html')">Configuration</a></li>
        <li><a href="#" onclick="navigate(event, 'index.html')" id="nav-camera" class="active">Camera</a></li>
        <li><a href="#" onclick="navigate(event, 'sensors/sensors.html')">Sensors</a></li>
        <li><a href="#" onclick="navigate(event, 'records/records.html')">Records</a></li>
        <li><a href="#" onclick="navigate(event, 'planification/planification.html')">Carte</a></li>
      </ul>
    </nav>
  </header>

  <iframe id="app-frame" src="index.html" allowtransparency="true"></iframe>

  <script>
    function adjustFrame() {
      var h = document.querySelector('header').offsetHeight;
      var frame = document.getElementById('app-frame');
      var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      frame.style.top = h + 'px';
      frame.style.height = (vh - h) + 'px';
    }

    function navigate(e, url) {
      e.preventDefault();
      document.getElementById('app-frame').src = url;
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      e.currentTarget.classList.add('active');
    }

    window.addEventListener('load', adjustFrame);
    window.addEventListener('resize', adjustFrame);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', adjustFrame);
    }
  </script>
</body>
</html>
