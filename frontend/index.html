<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./libs/sweetAlert/sweetAlert.min.css">
  <link rel="stylesheet" type="text/css" href="styles.css?v=4">
  <title>KOSMOS</title>
  <script>if (window.self === window.top) window.location.replace('./app.html');</script>
  <script src="./iframe-detect.js?v=4"></script>
</head>

<body>
  <header>
    <div class="brand">
      <img src="./img/logo_kosmos.png" alt="KOSMOS logo">
      <span>KOSMOS</span>
    </div>
    <nav>
      <ul>
        <li><a href="./campaign/campaign.html">Campaign</a></li>
        <li><a href="./config/config.html">Configuration</a></li>
        <li><a href="index.html">Camera</a></li>
        <li><a href="./sensors/sensors.html">Sensors</a></li>
        <li><a href="./records/records.html">Records</a></li>
        <!--<li><a href="./checklist/checklist.html">Checklist</a></li>-->
      </ul>
    </nav>
  </header>
  
  <section>
    <h3><span id="etat">Unknown KOSMOS state</span></h3>
    <div class="container">
      <h3>Recording</h3>
      <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:var(--sp-sm)">
        <button id="startCamera" onClick="start()">▶ Start</button>
        <button id="stopCamera" onClick="stop()">■ Stop</button>
      </div>
      <div id="recording-timer" style="display:none; font-size:1.4rem; font-weight:700; color:var(--c-accent); letter-spacing:0.06em; margin-bottom:var(--sp-md); font-variant-numeric:tabular-nums;"></div>

      <h3>Shutdown</h3>
      <p style="font-size:0.85rem; color:var(--c-text-muted); margin-bottom:var(--sp-sm)">
        <span id="checkConversion">Pas de conversion en cours</span>
      </p>
      <button id="shutdown" onClick="shutdown()">⏻ Shutdown</button>
    </div>
  </section>

  <script src="./libs/sweetAlert/sweetAlert.min.js"></script>
  <script src="cameraScript.js"></script>
  <script src="./config/state.js"></script>
  <script src="./config/metadata2.js"></script>
  <script src="./config/checkConversion.js"></script>

</body>

</html>
