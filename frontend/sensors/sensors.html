<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../libs/sweetAlert/sweetAlert.min.css">
  <link rel="stylesheet" type="text/css" href="../styles.css?v=4">
  <title>KOSMOS</title>
  <script src="../iframe-detect.js?v=4"></script>
</head>

<body>
  <header>
    <!--    <input type="checkbox" id="menuToggle" class="menu-toggle">

    <label for="menuToggle" class="menu-icon">
      <img src="./icons/menu.svg" class="svg-icon" alt="Menu Icon">
    </label>    -->
    <div class="brand">
      <img src="../img/logo_kosmos.png" alt="KOSMOS logo">
      <span>KOSMOS</span>
    </div>
    <nav>
      <ul>
        <li><a href="../campaign/campaign.html">Campaign</a></li>
        <li><a href="../config/config.html">Configuration</a></li>
        <li><a href="../index.html">Camera</a></li>
        <li><a href="./sensors.html">Sensors</a></li>
        <li><a href="../records/records.html">Records</a></li>
      </ul>
    </nav>
  </header>
  
  <section>
    <h3><span id="etat">Unknown KOSMOS state</span></h3>
    <div class="container">
      <h3>Live video</h3>
      
      <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:var(--sp-sm)">
        <button id="startLive" onClick="setLive(true)">Start Live</button>
        <button id="stopLive" onClick="setLive(false)">Stop Live</button>
      </div>
      <div id="live-frames" style="display:none; display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:var(--sp-sm);">
        <img id="frame"  style="max-width:240px; height:auto; border-radius:var(--r-sm); box-shadow:var(--shadow-sm);">
        <img id="frame2" style="display:none; max-width:240px; height:auto; border-radius:var(--r-sm); box-shadow:var(--shadow-sm);">
      </div>
      
      <h3 class="titleCamera">Moteur</h3>
      
      <p> <button id="motorPlus"> Avance </button> <span id="motor"> </span> </p>
            
      <h3 class="titleCamera"> Capteurs et horloge </h3>
      
      <p> <button id="testSensors"> Test </button> <button id="initSensors"> Init </button> <span id="init"> </span> </p>
      <p> <b>Luxmètre : </b> <span id="RGB"> </span> </p> 
      <p> <b>Capteur TP : </b> <span id="tp"> </span> </p>
      <p> <b>GPS : </b><span id="gps"> </span> </p>
      <p> <b>Compas : </b><span id="magneto"> </span> </p> 
      <p> <b>RTC : </b><span id="RTC"> </span> </p>
      <p> <b>Date et heure : </b><span id="time"> </span> </p>
      <p> <button id="syncTime" > Synchroniser heure </button> <span id="syncTimeMsg"> </span> </p>

      <h3 class="titleCamera">Eclairage</h3>
      
      <p> <button id="testLumen" onClick="lumen()">Test Lumiere</button> <span id="light"> </span> </p>
      
      <h3 class="titleCamera">Configuration Réseau</h3>

      <p> <button id="testIP">Statut ?</button> <button id="changeIP">Basculer</button> <span id="ip"> </span> </p>

      <h3 class="titleCamera">Mise à Jour de KosmOS</h3>
      
      <p> <button id="maj">M-à-J</button> <span id="maj_txt"> </span> </p>

    </div>
  </section>

  <script src="../libs/sweetAlert/sweetAlert.min.js"></script>
  <script src="sensors.js"></script>
  <script src="../config/state.js"></script>

</body>

</html>
